<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réglé la difficulter</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./asset/police/import.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body class="page-paramètre">
    <h1 id="titre-paramètre">Paramètre</h1>
    <div id="page_acuille_conteigner">
      <button type="button" id="retour">retourné a la page d'accuille</button>
    </div>

    <div id="conteigner-difficulter">
      <div id="difficulter">
        <div class="robot" data-difficulty="easy">
          <img
            src="./asset/img/robot-difficulter-facile.png"
            alt="robot niveau easy"
          />

          <p>niveau Facile</p>
        </div>
        <div class="robot" data-difficulty="normal">
          <img
            src="./asset/img/robot-difficulter-normal.png"
            alt="robot niveau medium"
          />

          <p>niveau Moyen</p>
        </div>
        <div class="robot" data-difficulty="hard">
          <img
            src="./asset/img/robot-difficulter-hard.png"
            alt="robot niveau hard"
          />
          <p>niveau Difficile</p>
        </div>
      </div>
    </div>
  </body>
</html>
